<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
</head>
<body>
    <button onclick="changetxt()">Change Text</button>
    <p id="txt">HELLO WORLD</p>

        function changetxt(){
            document.getElementById("txt").innerHTML = "HELLO INDIA";
        }
    </script>
</body>
