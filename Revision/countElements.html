<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="display: flex; flex-direction: column; align-items: center; gap: 20px; margin-top: 50px;">
    <h1 style="color:white; width: 200px; height: 50px; text-align: center; background-color:indigo;">Morning</h1>
    <h1 style="color:black; width: 200px; height: 50px; text-align: center; background-color:aqua;">Afternoon</h1>
    <h1 style="color:white; width: 200px; height: 50px; text-align: center; background-color:indigo;">Evening</h1>
    <button onclick="counter()">Count Element</button>

    <script>
        function counter(){
            let divs = document.getElementsByTagName("h1");
            alert("Total divs are: " + divs.length);
        }
    </script>
</body>
</html>
