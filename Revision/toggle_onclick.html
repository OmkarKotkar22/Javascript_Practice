<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #btn{
            background-color: green;
            color: white;
            width: 200px;
            height: 50px;
        }
        .active{
            background-color: red !important;
        }
    </style>
</head>
<body>
    <button id="btn" onclick="toggling()">Click Me</button>
    
    <script>
        function toggling(){
            let element = document.getElementById("btn");
            element.classList.toggle("active");
    }
    </script>
</body>
</html>
